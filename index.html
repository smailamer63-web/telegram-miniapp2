<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: #0088cc;
      color: white;
    }
  </style>
</head>
<body>

  <h2>👋 مرحبا بك في Mini App</h2>
  <p>هذا تطبيق داخل تلغرام</p>

  <button onclick="sendData()">إرسال بيانات للبوت</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function sendData() {
      tg.sendData("hello_from_webapp");
    }
  </script>

</body>
</html>
