<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Mini App</title>
</head>
<body>

<h2 id="app">جاري التحميل...</h2>

<script>
Telegram.WebApp.ready();

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
  document.getElementById("app").innerText = "❌ تم فتح التطبيق بطريقة غير صحيحة";
} else {
  fetch("https://telegram-bot-f2qm.onrender.com/me?token=" + token)
    .then(r => r.json())
    .then(u => {
      document.getElementById("app").innerHTML =
        `<h2>مرحبًا ${u.name}</h2><p>⭐ نقاطك: ${u.points}</p>`;
    })
    .catch(() => {
      document.getElementById("app").innerText = "❌ خطأ في الاتصال";
    });
}
</script>

</body>
</html>
